# Push a tag such as v0.1.0 to build culprit for Windows, Linux and macOS, publish a GitHub Release, and
# publish it to npm (culprit-cli) and the Homebrew tap (amirizalrahmat0799/tap).
#
# npm:      trusted publishing (Settings on npmjs.com for each package), or an NPM_TOKEN secret.
# Homebrew: a HOMEBREW_TAP_TOKEN secret that can push to the homebrew-tap repository; skipped without it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, exe: culprit }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: culprit }
          - { os: windows-latest, target: windows-x64, exe: culprit.exe }
          - { os: macos-latest, target: macos-universal, exe: culprit }
    steps:
      - uses: actions/checkout@v5
      - name: Version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCULPRIT_VERSION="$VERSION" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j 4
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          exe=$(find build -name '${{ matrix.exe }}' -type f | grep -v '\.dir' | head -1)
          "$exe" --version
          name=culprit-$VERSION-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$exe" dist/culprit.exe
            (cd dist && 7z a "$name.zip" culprit.exe > /dev/null && rm culprit.exe)
          else
            cp "$exe" dist/culprit
            tar -czf "dist/$name.tar.gz" -C dist culprit && rm dist/culprit
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the packages
        run: node scripts/npm-packages.mjs "${GITHUB_REF_NAME#v}" dist npm-out
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/npm-publish.sh npm-out

  homebrew:
    name: Update the Homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the formula
        run: bash scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist "$GITHUB_REPOSITORY" > culprit.rb && cat culprit.rb
      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the tap wasn't updated."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp culprit.rb tap/Formula/culprit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/culprit.rb
          if git diff --cached --quiet; then echo "the formula is already up to date"; exit 0; fi
          git commit -m "culprit ${GITHUB_REF_NAME#v}"
          git push
