name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Plain output and analysis of every sample
        shell: bash
        run: |
          exe=$(find build -name 'culprit' -o -name 'culprit.exe' | grep -v '\.dir' | grep -v '_tests' | head -1)
          "$exe" --version
          for f in testdata/*.log testdata/*.json; do "$exe" --plain --no-color "$f" > /dev/null; done
          "$exe" --plain --no-color --filter "level>=error" testdata/spring-boot.log | grep -q "in your code\|OrderService"
          cat testdata/compose.log | "$exe" --plain --no-color | grep -q "backend-1"
          "$exe" rules --check
          for f in testdata/*.log testdata/*.json; do "$exe" analyze --format json "$f" > /dev/null; done
          "$exe" analyze --no-color testdata/incident-migration.log | grep -q "Database migration V7__add_refunds.sql failed"
          if "$exe" analyze --fail-on error testdata/incident-migration.log > /dev/null; then
            echo "--fail-on error should have failed"; exit 1
          fi
      - name: Web viewer
        shell: bash
        run: |
          exe=$(find build -name 'culprit' -o -name 'culprit.exe' | grep -v '\.dir' | grep -v '_tests' | head -1)
          "$exe" web --no-open --no-follow --port 0 testdata/incident-migration.log 2> web.err &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 50); do grep -q 'http://127.0.0.1' web.err 2>/dev/null && break; sleep 0.2; done
          url=$(grep -o 'http://127.0.0.1[^ ]*' web.err | tr -d '\r')
          token=${url##*t=}
          base=${url%%/\?t=*}
          echo "$base"
          # the page and the API need the key
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/status")" = 403 ]
          curl -sf "$url" | grep -q '<title>culprit</title>'
          for _ in $(seq 50); do
            curl -sf -H "X-Culprit-Token: $token" "$base/api/report" | grep -q 'V7__add_refunds.sql' && ok=1 && break
            sleep 0.2
          done
          [ "${ok:-}" = 1 ]
      - name: AI investigation against a fake provider
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exe=$(find build -name 'culprit' -type f | grep -v '\.dir' | head -1)
          bash tests/ai_e2e.sh "$exe"
