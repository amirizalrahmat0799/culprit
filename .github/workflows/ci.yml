name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Plain output of every sample
        shell: bash
        run: |
          exe=$(find build -name 'culprit' -o -name 'culprit.exe' | grep -v '\.dir' | head -1)
          "$exe" --version
          for f in testdata/*; do "$exe" --plain --no-color "$f" > /dev/null; done
          "$exe" --plain --no-color --filter "level>=error" testdata/spring-boot.log | grep -q "in your code\|OrderService"
          cat testdata/compose.log | "$exe" --plain --no-color | grep -q "backend-1"
