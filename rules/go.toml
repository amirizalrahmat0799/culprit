# Go.

[[rule]]
id = "go.nil-pointer"
title = "Nil pointer dereference"
examples = [
  '''
panic: runtime error: invalid memory address or nil pointer dereference
[signal SIGSEGV: segmentation violation code=0x1 addr=0x0 pc=0x6b7a2c]''',
]
severity = "critical"
priority = 10
tags = ["go"]
contains = ["nil pointer dereference"]
level = "any"
explain = """
Code used a pointer, map entry, interface or struct field that was nil, and the program panicked. The \
first frame in your code in the goroutine trace shows where."""
fix = [
  "Check the value at that line: an error that was ignored (x, _ := ...) often leaves x nil.",
  "Check structs built without a constructor, where pointer fields stay nil.",
]

[[rule]]
id = "go.deadlock"
title = "All goroutines are asleep: deadlock"
examples = [
  'fatal error: all goroutines are asleep - deadlock!',
]
severity = "critical"
priority = 10
tags = ["go", "concurrency"]
contains = ["all goroutines are asleep"]
level = "any"
explain = """
Every goroutine was blocked (on a channel, a mutex or a WaitGroup), so nothing could ever continue. Common \
causes: sending on an unbuffered channel nobody reads, wg.Wait() with a missing wg.Done(), or locking a \
mutex twice."""
fix = [
  "The dump lists each goroutine and the line it's blocked on.",
  "Check every channel send has a receiver, and every wg.Add a matching Done (use defer wg.Done()).",
]

[[rule]]
id = "go.concurrent-map"
title = "Map used from several goroutines at once"
examples = [
  'fatal error: concurrent map writes',
]
severity = "critical"
priority = 10
tags = ["go", "concurrency"]
contains = ["concurrent map writes", "concurrent map read and map write", "concurrent map iteration and map write"]
level = "any"
explain = """
Two goroutines used the same map at the same time, at least one of them writing. Go stops the program \
because the map could be corrupted."""
fix = [
  "Protect the map with a sync.Mutex or sync.RWMutex, or use sync.Map.",
  "Run the tests with go test -race to find other races.",
]

[[rule]]
id = "go.index-out-of-range"
title = "Index out of range"
examples = [
  'panic: runtime error: index out of range [3] with length 3',
]
severity = "critical"
priority = 10
tags = ["go"]
contains = ["index out of range", "slice bounds out of range"]
level = "any"
explain = """
Code read past the end of a slice, array or string. Usually input shorter than expected (a split string, \
an empty result) used without checking its length."""
fix = [
  "Check len() before indexing at the line in your code.",
]

[[rule]]
id = "go.context-deadline"
title = "Context deadline exceeded"
examples = [
  '{"time":"2026-10-28T09:44:12Z","level":"ERROR","msg":"payment failed","err":"context deadline exceeded"}',
]
severity = "warning"
symptom = true
priority = 5
tags = ["go", "network"]
contains = ["context deadline exceeded"]
explain = """
An operation took longer than its context allowed and was cancelled. Usually the service or database it \
called was slow or unreachable."""
fix = [
  "Look at what was being called (a database, an HTTP service) and its latency at that time.",
  "Check the timeout is reasonable for the operation.",
]

[[rule]]
id = "go.dns"
title = "Host name couldn't be resolved"
examples = [
  'dial tcp: lookup payments-api on 127.0.0.11:53: no such host',
]
severity = "error"
priority = 8
tags = ["go", "network", "dns"]
contains = ["no such host"]
regex = 'lookup (\S+?)(?: on \S+)?: no such host'
captures = ["host"]
explain = """
DNS has no address for {host}. The name is misspelled or comes from a missing setting, or it only \
resolves inside another network (a Compose or Kubernetes service name)."""
fix = [
  "Check where the host name comes from (often an environment variable).",
  "Service names only resolve inside the same Compose network or Kubernetes namespace (or with the full name).",
]
