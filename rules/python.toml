# Python, Django, FastAPI/uvicorn, SQLAlchemy.

[[rule]]
id = "python.module-not-found"
title = "Python module {module} isn't installed"
examples = [
  '''
ModuleNotFoundError: No module named 'psycopg2'''',
]
severity = "critical"
priority = 10
tags = ["python", "startup", "dependencies"]
contains = ["modulenotfounderror"]
regex = "No module named '([^']+)'"
captures = ["module"]
explain = """
Python couldn't import {module}. The package isn't installed in the environment that runs the app (a \
different virtualenv or interpreter), or the import path is wrong for how the app is started."""
fix = [
  "Install it into the same environment: python -m pip install <package> (the package name can differ from {module}).",
  "Check which Python runs the app: python -c 'import sys; print(sys.executable)'.",
  "For your own packages, run from the project root, or use python -m package.module.",
]

[[rule]]
id = "python.import-name"
title = "Can't import {name} from {module}"
examples = [
  '''
ImportError: cannot import name 'User' from partially initialized module 'app.models' (most likely due to a circular import) (/app/app/models.py)''',
]
severity = "critical"
priority = 10
tags = ["python", "startup"]
contains = ["cannot import name"]
regex = "cannot import name '([^']+)' from (?:partially initialized module )?'([^']+)'"
captures = ["name", "module"]
explain = """
{module} was found but has no {name}. Either the installed version doesn't have it (renamed or removed), \
or two modules import each other and one isn't finished loading yet ('partially initialized module')."""
fix = [
  "If the message says 'partially initialized module', break the circular import: move the import into the function, or move shared code to a third module.",
  "Otherwise check the installed version: python -m pip show <package>.",
]

[[rule]]
id = "python.none-attribute"
title = "Used .{attribute} on None"
examples = [
  '''
AttributeError: 'NoneType' object has no attribute 'email'''',
]
severity = "error"
priority = 5
tags = ["python"]
contains = ["'nonetype' object has no attribute"]
regex = "'NoneType' object has no attribute '([^']+)'"
captures = ["attribute"]
explain = """
Code used .{attribute} on a value that was None. A lookup found nothing, a function returned nothing, or \
an optional field was missing."""
fix = [
  "The last frame in your code shows where; check where that value comes from.",
  "Check for None explicitly after lookups (dict.get, .first(), re.match).",
]

[[rule]]
id = "python.key-error"
title = "Missing key {key}"
examples = [
  '''
KeyError: 'DATABASE_URL'''',
]
severity = "error"
tags = ["python"]
contains = ["keyerror"]
regex = 'KeyError: (.+)$'
captures = ["key"]
explain = """
Code read the key {key} from a dict that doesn't have it. Often a missing environment variable \
(os.environ[...]), a missing field in JSON, or a renamed setting."""
fix = [
  "Use .get() with a default where the key is optional.",
  "For settings and environment variables, check they're set where the app runs.",
]

[[rule]]
id = "python.recursion"
title = "Maximum recursion depth exceeded"
examples = [
  'RecursionError: maximum recursion depth exceeded while calling a Python object',
]
severity = "error"
priority = 10
tags = ["python"]
contains = ["maximum recursion depth exceeded"]
explain = """
A function called itself (directly or through others) about 1000 times deep. Usually recursion without an \
end, or a property or __getattr__ that calls itself."""
fix = [
  "Look at the repeating lines in the traceback to find the loop.",
]

[[rule]]
id = "python.asgi-app"
title = "uvicorn couldn't load the app"
examples = [
  'ERROR:    Error loading ASGI app. Could not import module "main".',
]
severity = "critical"
priority = 10
tags = ["python", "fastapi", "startup"]
contains = ["error loading asgi app"]
explain = """
uvicorn couldn't import the application given as module:attribute. The module path, the attribute name, \
or the working directory is wrong, or importing the module raised an error."""
fix = [
  "Check the argument, for example uvicorn app.main:app, matches the file and the variable name.",
  "Run it from the project root, or pass --app-dir.",
]

[[rule]]
id = "django.no-such-table"
title = "Django table doesn't exist: migrations not applied"
examples = [
  'django.db.utils.OperationalError: no such table: shop_order',
]
severity = "error"
priority = 12
tags = ["python", "django", "database"]
contains = ["django.db.utils"]
regex = '(?:no such table|relation "[^"]+" does not exist|Table .* doesn.t exist)'
explain = """
The database doesn't have a table Django expects. Migrations haven't been run in this environment, or a \
model change has no migration yet."""
fix = [
  "Run python manage.py migrate in this environment.",
  "If models changed, create the migration first: python manage.py makemigrations.",
]

[[rule]]
id = "sqlalchemy.operational"
title = "SQLAlchemy couldn't talk to the database"
examples = [
  'sqlalchemy.exc.OperationalError: (psycopg2.OperationalError) connection to server at "db" (172.18.0.2), port 5432 failed: Connection refused',
]
severity = "error"
symptom = true
priority = 5
tags = ["python", "sqlalchemy", "database"]
contains = ["sqlalchemy.exc.operationalerror"]
explain = """
The database driver reported an operational problem: it couldn't connect, the connection dropped, or the \
server refused the operation. The driver's message after OperationalError says which."""
fix = [
  "Read the text after (psycopg2.OperationalError) or similar; it's the database's own error.",
  "For dropped idle connections, set pool_pre_ping=True or pool_recycle on the engine.",
]

[[rule]]
id = "python.address-in-use"
title = "Address already in use"
examples = [
  'OSError: [Errno 98] Address already in use',
]
severity = "critical"
priority = 15
tags = ["python", "startup", "network"]
contains = ["[errno 98] address already in use", "[errno 48] address already in use", "[errno 10048]"]
explain = """
The server couldn't listen on its port because another process already does, often an earlier copy of \
the app or another service on the same port."""
fix = [
  "Find it: lsof -i :<port> or ss -ltnp, and stop it, or start this one on another port.",
]

[[rule]]
id = "gunicorn.worker-timeout"
title = "gunicorn killed a worker that took too long"
examples = [
  "[2026-11-04 10:00:31 +0000] [1] [CRITICAL] WORKER TIMEOUT (pid:42)",
]
severity = "error"
priority = 15
tags = ["python", "gunicorn"]
contains = ["worker timeout (pid:"]
level = "any"
explain = """
A worker handled one request for longer than gunicorn's timeout (30 seconds by default), so gunicorn killed \
it and the request failed. The request was waiting on something slow (a database query, another service), \
or the work belongs in a background job."""
fix = [
  "Find the slow request: the access log entry for that worker's request is missing, and the one just before it in the app log is the suspect.",
  "Give outgoing calls their own timeouts, shorter than gunicorn's.",
  "Move slow work to a queue (Celery, RQ); raise --timeout only for endpoints that are slow on purpose.",
  "With async frameworks, use an async worker class (uvicorn.workers.UvicornWorker) so one slow call doesn't block the worker.",
]

[[rule]]
id = "django.disallowed-host"
title = "Django refused the Host {host}"
examples = [
  "django.core.exceptions.DisallowedHost: Invalid HTTP_HOST header: 'shop.example.com'. You may need to add 'shop.example.com' to ALLOWED_HOSTS.",
]
severity = "warning"
priority = 15
tags = ["python", "django", "config"]
contains = ["invalid http_host header"]
regex = "Invalid HTTP_HOST header: '([^']+)'"
captures = ["host"]
explain = """
A request came for {host}, which isn't in ALLOWED_HOSTS, so Django answered 400. If {host} is your site, \
ALLOWED_HOSTS is missing it; if it's an IP address or a name you don't own, it's a scanner and can be \
ignored."""
fix = [
  "Add your real domains to ALLOWED_HOSTS (and the load balancer's health check host, if it uses one).",
  "Behind a proxy, check it passes the original Host header.",
  "Ignore requests for hosts you don't own; don't use ALLOWED_HOSTS = ['*'] in production.",
]

[[rule]]
id = "celery.broker-unreachable"
title = "Celery can't reach its broker"
examples = [
  "[2026-11-04 10:00:00,120: ERROR/MainProcess] consumer: Cannot connect to amqp://guest:**@127.0.0.1:5672//: [Errno 111] Connection refused.",
  "[2026-11-04 10:00:00,120: ERROR/MainProcess] consumer: Cannot connect to redis://localhost:6379/0: Error 111 connecting to localhost:6379. Connection refused..",
]
severity = "error"
symptom = true
priority = 18
tags = ["python", "celery", "messaging"]
contains = ["consumer: cannot connect to"]
explain = """
The Celery worker couldn't connect to the broker (RabbitMQ or Redis), so no tasks run and tasks sent by the \
app pile up or fail. The broker is down, or CELERY_BROKER_URL points at the wrong host (localhost inside a \
container)."""
fix = [
  "Check the broker is up and reachable from the worker.",
  "Check the broker URL the worker uses; in Docker use the service name.",
]

[[rule]]
id = "celery.time-limit"
title = "A Celery task ran past its time limit"
examples = [
  "[2026-11-04 10:05:00,004: ERROR/MainProcess] Hard time limit (300s) exceeded for reports.export[3f2b1c4e-7d6a-4e1b-9c8f-2a1b3c4d5e6f]",
  "celery.exceptions.SoftTimeLimitExceeded: SoftTimeLimitExceeded()",
]
severity = "error"
priority = 15
tags = ["python", "celery"]
contains = ["time limit (", "softtimelimitexceeded", "timelimitexceeded"]
regex = '((?:Hard|Soft) time limit \(\d+(?:\.\d+)?s\) exceeded|SoftTimeLimitExceeded|TimeLimitExceeded)'
explain = """
A task ran longer than its time limit. At the soft limit the task gets SoftTimeLimitExceeded and can clean \
up; at the hard limit the worker process is killed and the task is lost (or retried, with acks_late)."""
fix = [
  "Find what made it slow: the task's own log lines, and the services it called.",
  "Split big tasks into smaller ones (chunks, a chord or group).",
  "Catch SoftTimeLimitExceeded to save progress, and set the hard limit a bit above the soft one.",
]
